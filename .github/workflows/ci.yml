name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - name: Install gateway dependencies
        run: python -m pip install -r gateway/requirements.txt
      - name: Check Python syntax and gateway behavior
        working-directory: gateway
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v
          python -m pip check
      - name: Validate Compose configuration
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
        run: docker compose config --quiet
      - name: Build gateway image
        run: docker build -t mini-ai-gateway:ci gateway
