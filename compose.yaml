services:
  inference:
    image: vllm/vllm-openai:v0.29.0

    environment:
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"

    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/vllm:/root/.cache/vllm

    ports:
      - "8000:8000"

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

    restart: unless-stopped

    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    command:
      - Qwen/Qwen3-0.6B
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.80"

  gateway:
    build:
      context: ./gateway

    environment:
      VLLM_BASE_URL: http://inference:8000
      MODEL_NAME: Qwen/Qwen3-0.6B

    ports:
      - "8080:8080"

    depends_on:
      inference:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live')
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped